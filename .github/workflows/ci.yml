name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install (CPU torch)
        run: pip install --extra-index-url https://download.pytorch.org/whl/cpu -r requirements-train.txt
      - name: Unit + API tests (fast mode, no LLM / network)
        env:
          LLM_PROVIDER: none
          WEB_SEARCH_ENABLED: "false"
          LOAD_TRANSFORMER: "false"   # keep CI quick; ONNX model is exercised locally
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
