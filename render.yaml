# Render blueprint: Dashboard -> New -> Blueprint -> pick this repo.
# After the first deploy set GROQ_API_KEY (free key: https://console.groq.com/keys).
services:
  - type: web
    name: verifact-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: LLM_PROVIDER
        value: groq
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-20b
      - key: ALLOWED_ORIGINS
        value: "*"
      - key: LOAD_TRANSFORMER
        value: "true"
      - key: LOAD_EMBED
        value: "true"
      - key: WEB_SEARCH_ENABLED
        value: "true"
      - key: DB_PATH
        value: /tmp/verifact.db
